name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full-matrix sweep (Sunday 03:15 UTC): push/PR runs cover the
    # support-floor (3.11) and current (3.13) plus Windows; the middle
    # version only breaks on interpreter-specific regressions, which this
    # scheduled run catches within a week instead of burning an extra
    # full-suite run on every push (the suite ran 5x per push before). The
    # same run does the scrambled-directory-order screen.
    - cron: "15 3 * * 0"
  # By hand: runs the push set plus the scrambled-directory-order job.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Push/PR floor + current only; 3.12 comes via the weekly schedule
        # (and via test-windows on every push). Floor is 3.11 because pandas
        # 3.x — the line this project develops and locks against — publishes
        # requires-python >=3.11; a 3.10 job can no longer even install.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # Hash BOTH dependency surfaces: every job here installs from
          # pyproject (editable / extras) or from requirements.lock, so a
          # change to either must invalidate the shared pip cache.
          cache-dependency-path: |
            pyproject.toml
            requirements.lock
      - name: Install (with dev + web extras)
        # [web] is required, not optional, here: tests/test_web_*.py import
        # fastapi.testclient at module scope, so a [dev]-only install fails at
        # collection time and the web regression suite silently never runs.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"
      - name: Run test suite with coverage
        # Coverage stays local (no upload yet): the term-missing report surfaces
        # untested modules directly in the CI log so the gaps are visible
        # without a third-party badge service. Output is tee'd to pytest.log so
        # the failure-summary step below can republish the failing test names
        # on the run's summary page. Both the raw logs and that summary need a
        # GitHub sign-in, even on a public repo (checked as an anonymous visitor
        # on 2026-11-23: the job page shows only "Sign in to view logs"). What
        # an anonymous reader CAN get is each job's conclusion and step-level
        # status through the REST API, which is enough to see THAT the suite is
        # red, not which tests failed.
        # Coverage scope: the package plus the two run-in-place trees (web/,
        # scripts/). The --cov flags override `[tool.coverage.run] source` in
        # pyproject.toml, so the two lists must stay in sync.
        run: pytest -q --cov=yialpha --cov=web --cov=scripts --cov-report=term-missing 2>&1 | tee pytest.log; test ${PIPESTATUS[0]} -eq 0
      - name: Publish failure summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Test failures (auto-extracted)"
            grep -E "^(FAILED|ERROR) " pytest.log || echo "(no FAILED/ERROR lines captured)"
            echo ""
            echo "### Tail of pytest output"
            tail -n 40 pytest.log
          } >> "$GITHUB_STEP_SUMMARY"

  test-weekly-full:
    # Scheduled-only full interpreter matrix: the middle version (3.12) is
    # covered here weekly instead of on every push.
    if: github.event_name == 'schedule'
    name: tests weekly full (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock
      - name: Install (with dev + web extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"
      - name: Run test suite with coverage
        # Same tee + summary pattern as the ubuntu `test` job (see the note
        # there: the summary needs a GitHub sign-in too).
        run: pytest -q --cov=yialpha --cov=web --cov=scripts --cov-report=term-missing 2>&1 | tee pytest.log; test ${PIPESTATUS[0]} -eq 0
      - name: Publish failure summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Test failures (auto-extracted)"
            grep -E "^(FAILED|ERROR) " pytest.log || echo "(no FAILED/ERROR lines captured)"
            echo ""
            echo "### Tail of pytest output"
            tail -n 40 pytest.log
          } >> "$GITHUB_STEP_SUMMARY"

  test-directory-order:
    # Weekly screen for tests whose outcome depends on the order in which a
    # directory lists its entries. Path.glob / iterdir order belongs to the
    # file system -- sorted by name on NTFS, creation order on a fresh WSL
    # disk, neither on a hosted runner's ext4 -- so such a test passes wherever
    # the order happens to match: the first CI run on the round-17 tree failed
    # one on both ubuntu lanes while every local lane was green. The plugin in
    # tests/_plugins/ permutes every listing; the run id is the seed, so each
    # run samples a new order and a failure is reproduced with that number:
    #   SHUFFLE_SEED=<run id> PYTHONPATH=tests/_plugins pytest -p shuffle_plugin
    # Not on every push: one more full suite for a class of defect the weekly
    # pass already catches.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: tests, scrambled directory order (py3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock
      - name: Install (with dev + web extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"
      - name: Show that the plugin is active
        env:
          SHUFFLE_SEED: ${{ github.run_id }}
          PYTHONPATH: tests/_plugins
        run: python -c "import os, shuffle_plugin; print('os.scandir comes from', os.scandir.__module__, '| seed', shuffle_plugin.SEED)"
      - name: Run test suite with every directory listing permuted
        env:
          SHUFFLE_SEED: ${{ github.run_id }}
          PYTHONPATH: tests/_plugins
        # Same tee + summary pattern as the ubuntu `test` job (see the note
        # there: the summary needs a GitHub sign-in too).
        run: pytest -q -p shuffle_plugin --cov=yialpha --cov=web --cov=scripts --cov-report=term-missing 2>&1 | tee pytest.log; test ${PIPESTATUS[0]} -eq 0
      - name: Publish failure summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Test failures (auto-extracted)"
            echo "Directory-order seed: $SHUFFLE_SEED -- reproduce with"
            echo 'SHUFFLE_SEED='"$SHUFFLE_SEED"' PYTHONPATH=tests/_plugins pytest -p shuffle_plugin'
            grep -E "^(FAILED|ERROR) " pytest.log || echo "(no FAILED/ERROR lines captured)"
            echo ""
            echo "### Tail of pytest output"
            tail -n 40 pytest.log
          } >> "$GITHUB_STEP_SUMMARY"

  test-windows:
    # The project is developed on Windows (Git Bash), yet the suite only ever
    # ran on ubuntu — Windows-specific semantics (backslash paths, os.replace,
    # MSVCRT localtime/TZ handling, file locking) were never CI-verified.
    # Mirrors the ubuntu `test` job exactly (same install, same full suite) on
    # windows-latest + py3.12. No deselect list: verified locally that the full
    # suite passes on Windows when the clock timezone is UTC (GitHub-hosted
    # runners, both OSes, run UTC); date-window tests that fail on a non-UTC
    # dev machine pass under TZ=UTC.
    name: tests (windows, py3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock
      - name: Install (with dev + web extras)
        # bash (preinstalled on windows runners) for exact shell parity with
        # the ubuntu job — same quoting rules, same multi-line run blocks.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"
      - name: Run test suite with coverage
        shell: bash
        # Same tee + summary pattern as the ubuntu `test` job (see the note
        # there: the summary needs a GitHub sign-in too).
        run: pytest -q --cov=yialpha --cov=web --cov=scripts --cov-report=term-missing 2>&1 | tee pytest.log; test ${PIPESTATUS[0]} -eq 0
      - name: Publish failure summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Test failures (auto-extracted)"
            grep -E "^(FAILED|ERROR) " pytest.log || echo "(no FAILED/ERROR lines captured)"
            echo ""
            echo "### Tail of pytest output"
            tail -n 40 pytest.log
          } >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    # Gradual typing across the whole package. The scope used to be a
    # hand-maintained module list and silently missed four packages that were
    # added later (instruments, ledger, perp, regime) plus four top-level
    # modules; naming the package root makes every sub-package part of the
    # gate from the day it is created.
    name: mypy (whole yialpha package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Type-check the package
        # --no-site-packages: required because risk/backtest/dataflows directly
        # `import numpy`, and numpy>=2.1's bundled stub uses PEP 695 `type`
        # aliases (Py 3.12+) which mypy cannot parse under our
        # python_version="3.11" baseline. --follow-imports=skip alone is
        # insufficient for direct imports (the stub is parsed at the syntax
        # stage before follow policy applies); --no-site-packages makes mypy
        # treat ALL third-party modules as Any, so the stub is never parsed.
        # The project's own source files are still fully type-checked. Scope
        # widened 2026-08-10 from money-path-only (7 files) to 6 packages, on
        # 2026-08-14 to 13 packages + 4 top-level modules, and on 2026-11-23
        # to the package root (the list had drifted: 4 packages + 4 top-level
        # modules were outside the gate).
        run: mypy --no-site-packages --follow-imports=skip yialpha

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock
      - name: Fresh install (no dev extras) and import
        run: |
          python -m pip install --upgrade pip
          pip install .
          # Catches undeclared runtime deps (e.g. #994 python-dotenv): a bare
          # install must import the package and the CLI module.
          # round-13: -I (isolated mode) — the plain `python -c` run executes
          # with the checkout as cwd, and '' (cwd) sits first on sys.path, so
          # the source tree shadowed the installed wheel and the "bare install
          # imports" claim tested nothing. -I drops the cwd prepend (and
          # PYTHON* env vars / user site) so only the installed dist resolves;
          # this is interpreter semantics, identical on every OS.
          python -I -c "import yialpha, yialpha.cli.main; print('clean-install import OK')"

  lockfile:
    # requirements.lock is what the README tells users to install from (line
    # "pip install -r requirements.lock"), yet no other job resolves it — the
    # editable installs float above the pins. A lock that no longer installs
    # (yanked artifact, transitive pin that stopped resolving) must fail CI,
    # not the user's first install.
    name: lockfile install (requirements.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          # This job installs exclusively from the lock — pyproject.toml is
          # hashed too so editing dependencies (the usual reason the lock is
          # regenerated) still rotates the cache key.
          cache-dependency-path: |
            pyproject.toml
            requirements.lock
      - name: Install from the lockfile and import
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          # The lock resolves the dependency graph; the import (run from the
          # checkout, so the source tree supplies the package) proves the
          # locked versions satisfy the package's own import-time deps.
          python -c "import yialpha; print('lockfile install import OK')"

  smoke-extras:
    name: extras install smoke (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The [dev]-only lock never resolves these install graphs, so a
          # regression in an extra's dependency chain (e.g. a version floor
          # that pulls a missing wheel) would go unnoticed until a user hit it.
          - label: web
            extras: web
            # web extra: the web UI tree is run-in-place (not packaged), but
            # importing its deps (fastapi, uvicorn) verifies the install graph.
            imports: "import fastapi, uvicorn"
          - label: bedrock
            extras: bedrock
            # Bedrock LLM transport; lazy-imported at runtime, so only an
            # explicit import proves the graph installs.
            imports: "import langchain_aws"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock
      - name: Install with optional extras and import key modules
        run: |
          python -m pip install --upgrade pip
          pip install ".[${{ matrix.extras }}]"
          python -c "${{ matrix.imports }}; print('${{ matrix.label }} extras import OK')"

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock
      - name: Install ruff
        run: pip install "ruff>=0.15"
      - name: Lint the repository
        # The repo is fully clean under the strict select, so we lint everything
        # (results/ is excluded via pyproject extend-exclude).
        run: ruff check .
