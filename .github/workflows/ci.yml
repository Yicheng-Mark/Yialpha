name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev + web extras)
        # [web] is required, not optional, here: tests/test_web_*.py import
        # fastapi.testclient at module scope, so a [dev]-only install fails at
        # collection time and the web regression suite silently never runs.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"
      - name: Run test suite with coverage
        # Coverage stays local (no upload yet): the term-missing report surfaces
        # untested modules directly in the CI log so the gaps are visible
        # without a third-party badge service.
        run: pytest -q --cov=yiagents --cov-report=term-missing

  typecheck:
    # Gradual typing: mypy is scoped to the money path (execution), risk overlay,
    # backtest engine, graph, agents, dataflows, and CLI. Widen the scope as
    # baselines are cleaned.
    name: mypy (money path + risk + engine + dataflows + cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Type-check scoped modules
        # --no-site-packages: required because risk/backtest/dataflows directly
        # `import numpy`, and numpy>=2.1's bundled stub uses PEP 695 `type`
        # aliases (Py 3.12+) which mypy cannot parse under our
        # python_version="3.10" baseline. --follow-imports=skip alone is
        # insufficient for direct imports (the stub is parsed at the syntax
        # stage before follow policy applies); --no-site-packages makes mypy
        # treat ALL third-party modules as Any, so the stub is never parsed.
        # The project's own source files are still fully type-checked.
        # Scope widened 2026-08-10 from money-path-only (7 files) to 6 packages
        # (~111 files), and 2026-08-14 to add llm_clients (every agent's LLM
        # transport), batch, monitoring, and the four top-level modules.
        run: mypy --no-site-packages --follow-imports=skip yiagents/execution yiagents/risk yiagents/backtest yiagents/graph yiagents/agents yiagents/dataflows yiagents/cli yiagents/llm_clients yiagents/batch yiagents/monitoring yiagents/reporting.py yiagents/config_snapshot.py yiagents/default_config.py yiagents/logging_config.py

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fresh install (no dev extras) and import
        run: |
          python -m pip install --upgrade pip
          pip install .
          # Catches undeclared runtime deps (e.g. #994 python-dotenv): a bare
          # install must import the package and the CLI module.
          python -c "import yiagents, yiagents.cli.main; print('clean-install import OK')"

  lockfile:
    # requirements.lock is what the README tells users to install from (line
    # "pip install -r requirements.lock"), yet no other job resolves it — the
    # editable installs float above the pins. A lock that no longer installs
    # (yanked artifact, transitive pin that stopped resolving) must fail CI,
    # not the user's first install.
    name: lockfile install (requirements.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from the lockfile and import
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          # The lock resolves the dependency graph; the import (run from the
          # checkout, so the source tree supplies the package) proves the
          # locked versions satisfy the package's own import-time deps.
          python -c "import yiagents; print('lockfile install import OK')"

  smoke-extras:
    name: extras install smoke (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The [dev]-only lock never resolves these install graphs, so a
          # regression in an extra's dependency chain (e.g. a version floor
          # that pulls a missing wheel) would go unnoticed until a user hit it.
          - label: web + a-share
            extras: web,a-share
            # web extra: the web UI tree is run-in-place (not packaged), but
            # importing its deps (fastapi, uvicorn) verifies the install graph.
            # a-share extra: vendors are lazy-imported at runtime; importing
            # them here confirms the native libs are installed and loadable.
            imports: "import fastapi, uvicorn, baostock, akshare"
          - label: bedrock
            extras: bedrock
            # Bedrock LLM transport; lazy-imported at runtime like the a-share
            # vendors, so only an explicit import proves the graph installs.
            imports: "import langchain_aws"
          - label: a-share-tushare
            extras: a-share-tushare
            # Tushare Pro quality tier (needs TUSHARE_TOKEN at runtime).
            imports: "import tushare"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with optional extras and import key modules
        run: |
          python -m pip install --upgrade pip
          pip install ".[${{ matrix.extras }}]"
          python -c "${{ matrix.imports }}; print('${{ matrix.label }} extras import OK')"

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.15"
      - name: Lint the repository
        # The repo is fully clean under the strict select, so we lint everything
        # (results/ and worklog/ are excluded via pyproject extend-exclude).
        run: ruff check .
