name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite with coverage
        # Coverage stays local (no upload yet): the term-missing report surfaces
        # untested modules directly in the CI log so the gaps are visible
        # without a third-party badge service.
        run: pytest -q --cov=yiagents --cov-report=term-missing

  typecheck:
    # Gradual typing: mypy is scoped to the money path (yiagents/execution) and
    # the state contract (graph/propagation.py). Widen the scope as baselines
    # are cleaned — running mypy on the whole repo today produces hundreds of
    # third-party import errors that drown out real issues.
    name: mypy (money path + state contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Type-check scoped modules
        # --follow-imports=skip: the explicitly-listed source files (money path
        # + state contract) are still fully type-checked; only transitively-
        # imported modules are treated as opaque. Required because numpy>=2.1's
        # bundled stub uses PEP 695 `type` aliases (Py 3.12+) which mypy cannot
        # parse under our python_version="3.10" baseline, and the [syntax] error
        # aborts the run before any real issues surface. See pyproject.toml
        # [tool.mypy.overrides] for the matching per-module note.
        run: mypy --follow-imports=skip yiagents/execution yiagents/graph/propagation.py

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fresh install (no dev extras) and import
        run: |
          python -m pip install --upgrade pip
          pip install .
          # Catches undeclared runtime deps (e.g. #994 python-dotenv): a bare
          # install must import the package and the CLI module.
          python -c "import yiagents, yiagents.cli.main; print('clean-install import OK')"

  smoke-extras:
    name: extras install smoke (web, a-share)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with optional extras and import key modules
        run: |
          python -m pip install --upgrade pip
          # The [dev]-only lock never resolves these install graphs, so a
          # regression in an extra's dependency chain (e.g. a version floor that
          # pulls a missing wheel) would go unnoticed until a user hit it.
          pip install ".[web,a-share]"
          # web extra: the web UI tree is run-in-place (not packaged), but
          # importing its deps (fastapi, uvicorn) verifies the install graph.
          python -c "import fastapi, uvicorn; print('web extras import OK')"
          # a-share extra: vendors are lazy-imported at runtime; importing them
          # here confirms the native libs are installed and loadable.
          python -c "import baostock, akshare; print('a-share extras import OK')"

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.15"
      - name: Lint the repository
        # The repo is fully clean under the strict select, so we lint everything
        # (results/ and worklog/ are excluded via pyproject extend-exclude).
        run: ruff check .
