[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yialpha"
version = "1.0.0"
description = "YiAlpha: Multi-Agent LLM Financial Analysis Framework"
readme = "README.md"
# Floor is 3.11, not 3.10: pandas 3.x (the line this project develops and
# locks against) publishes requires-python >=3.11, so a 3.10 resolution can
# never satisfy the dependency graph. 3.10 reaches EOL 2026-10 regardless.
requires-python = ">=3.11"
dependencies = [
    # Version floors are pinned to the major.minor actually verified by
    # requirements.lock. A fresh `pip install` with loose resolution must not
    # land on an older, untested major line (e.g. langchain 0.3.x vs the 1.x
    # the project is developed against). Patch-level float is allowed for
    # security updates.
    "langchain-core>=1.5",
    "filelock>=3.13",
    "langchain-anthropic>=1.5",
    "langchain-experimental>=0.4",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=1.4",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "pandas>=3.0",
    "python-dotenv>=1.0.0",
    # PySocks is load-bearing: yfinance / market data must traverse the SOCKS5
    # proxy (socks5h://127.0.0.1:1080), and the Binance USDT-M vendor reaches
    # fapi.binance.com through the same proxy via `requests`. Declared so a
    # fresh install actually resolves hostnames instead of hanging on DNS.
    "PySocks>=1.7.1",
    "questionary>=2.1.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "stockstats>=0.6.5",
    "tqdm>=4.70",
    "typing-extensions>=4.14.0",
    "yfinance>=1.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "pytest>=8.0",
    "pytest-subtests>=0.13",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    # FastAPI's TestClient (tests/test_web_*.py) is httpx-backed. httpx is only
    # a transitive dep in practice (langchain-openai -> openai -> httpx), so a
    # [dev]-only resolution must declare it or the web tests cannot even import.
    "httpx>=0.27",
    # Test-only. backtest/{metrics,ic,event_study}.py and the A/B gate treat
    # scipy as an OPTIONAL accelerator and ship numpy/math fallbacks so the
    # runtime install stays lean. The tests that pin "fallback == scipy to
    # 1e-12" (DSR moments, normal CDF/PPF, Spearman IC, chi-square gate)
    # importorskip("scipy"): absent from the test environment they skip
    # silently, which is what happened in CI — 8 tests, never run there.
    "scipy>=1.14",
]
# Amazon Bedrock support (AWS SigV4 auth + boto3). Optional so the core install
# stays lean: pip install "yialpha[bedrock]".
bedrock = [
    "langchain-aws>=1.5.0",
]
# Local web UI (FastAPI + vanilla JS). Optional so a headless / server install
# stays lean: pip install "yialpha[web]". The web/ source tree is NOT a
# packaged module (excluded from packages.find below) — it's run in place from
# the project root (it spawns scripts/run_robust.py and reads ~/.yialpha/logs).
# Plain ``uvicorn`` (no [standard] extra) is enough for the default run; the
# [standard] extra only adds auto-reload/websockets deps we don't use.
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
yialpha = "yialpha.cli.main:app"

[tool.setuptools.packages.find]
include = ["yialpha*"]

[tool.setuptools.package-data]
"yialpha.cli" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "-m 'not integration'" keeps the default run hermetic: a dev box whose .env
# holds real keys (yialpha/__init__.py load_dotenv) would otherwise fire live
# API calls in TestGLMLiveStructuredOutput, failing whenever the provider
# endpoint is unreachable (e.g. the 2026-09-30 GLM coding-plan outage). CI has
# no secrets so integration tests skip there either way. Opt back in with an
# explicit `pytest -m integration` (a CLI -m overrides this one).
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
# yialpha + the two run-in-place trees. web/ and scripts/ are not packaged
# modules, so they can only be measured as source directories. NOTE: the
# `--cov=` flags on ci.yml's pytest command lines override this `source`, so
# the workflow and this list must agree (tests/test_round16_packaging_ci.py).
source = ["yialpha", "web", "scripts"]

[tool.coverage.report]
# Coverage gate. The floor was 75 for fifteen weeks while the suite actually
# measured 95.5% (2026-11-23: 95.52-95.53% of 19,393 statements on every
# OS x interpreter lane — Windows and Linux, py3.11 / 3.12 / 3.13), so a
# regression of up to twenty points would have passed. Re-based to 90: a
# cushion deliberately wider than the 3 points used before, because the
# GitHub-hosted runners cannot be reproduced exactly locally.
# 2026-11-28, scope yialpha + web + scripts: every lane measures 99.87-99.90%
# of 22,287 statements (22-28 untested) -- Windows and Linux (WSL), py3.11 /
# 3.12 / 3.13, fresh unconstrained installs and a hash-checked install of
# requirements.lock -- so the floor now leaves room for ~2,200 untested
# statements. Raise it once a CI run under the widened scope has reported;
# tests/test_round16_packaging_ci.py pins the floor at >= 90.
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["results"]

[tool.ruff.lint]
# Standard "good defaults" rule set (pyflakes + pycodestyle + isort + bugbear +
# pyupgrade + comprehensions/simplify). Line length (E501) and layout are owned
# by the formatter; whole-repo `ruff format` adoption is deferred until the
# open-PR backlog clears, to avoid mass merge conflicts.
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]   # intentional re-exports
"yialpha/cli/main.py" = ["B008"]  # typer.Option(...) defaults are the framework's idiom

[tool.ruff.lint.isort]
# Keep multiple aliased names from one module in a single combined import block
# (e.g. the vendor re-exports in interface.py) instead of one statement per name.
combine-as-imports = true

[tool.mypy]
# Gradual typing: the repo carries inline annotations on ~87% of source files.
# We start permissive (no --strict) and tighten per-module as baselines are
# cleaned. The CI job type-checks the whole ``yialpha`` package (naming the
# package root, so a newly added sub-package is gated from day one) — see the
# typecheck job in ci.yml.
python_version = "3.11"
warn_unused_ignores = false
warn_redundant_casts = true
warn_return_any = false
no_implicit_optional = true
check_untyped_defs = false

# Third-party libs (langchain, yfinance, binance SDK, …) ship no
# py.typed markers; silence their import errors so real issues stay visible.
ignore_missing_imports = true

# Skip opening any transitive stub (incl. numpy's PEP 695 `type X = ...` aliases,
# which require Python 3.12+ and abort the run with a [syntax] error under
# python_version="3.11"). This mirrors the ``--follow-imports=skip`` CLI flag in
# ci.yml. NOTE: --follow-imports=skip alone only handles *transitive* imports.
# When a checked source file *directly* does ``import numpy`` (as risk/,
# backtest/, dataflows/ do), mypy still parses numpy's stub and aborts. The real
# workaround for direct imports is ``--no-site-packages`` in ci.yml, which makes
# mypy treat ALL third-party modules as Any so the stub is never parsed. The
# project's own source files are still fully type-checked either way.
follow_imports = "skip"

[[tool.mypy.overrides]]
# Forward documentation for the numpy PEP 695 stub issue (numpy>=2.1 ships
# ``type X = ...`` aliases in numpy/__init__.pyi that require Python 3.12+; we
# type-check against 3.11 so parsing the stub raises [syntax] and aborts the run
# before any real issues surface). A per-module follow_imports override does NOT
# prevent the syntax-parse stage from failing (the stub is parsed before follow
# policy is applied), so this override alone is cosmetic. The real fixes are the
# ``--no-site-packages --follow-imports=skip`` CLI flags in ci.yml. We keep this
# override as forward documentation: if mypy later honors per-module
# follow_imports at parse time, or if numpy is bumped/pinned differently, this
# records the intent for numpy specifically.
module = "numpy"
follow_imports = "skip"
