[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yiagents"
version = "0.3.0"
description = "YiAgents: Multi-Agent LLM Financial Analysis Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Version floors are pinned to the major.minor actually verified by
    # requirements.lock. A fresh `pip install` with loose resolution must not
    # land on an older, untested major line (e.g. langchain 0.3.x vs the 1.x
    # the project is developed against). Patch-level float is allowed for
    # security updates.
    "langchain-core>=1.5",
    "backtrader>=1.9.78.123",
    "filelock>=3.13",
    "langchain-anthropic>=1.5",
    "langchain-experimental>=0.4",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=1.4",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "pandas>=3.0",
    "parsel>=1.10.0",
    "python-dotenv>=1.0.0",
    # PySocks is load-bearing: yfinance / market data must traverse the SOCKS5
    # proxy (socks5h://127.0.0.1:1080), and the Binance USDT-M vendor reaches
    # fapi.binance.com through the same proxy via `requests`. Declared so a
    # fresh install actually resolves hostnames instead of hanging on DNS.
    "PySocks>=1.7.1",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "redis>=8.1",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "stockstats>=0.6.5",
    "tqdm>=4.70",
    "typing-extensions>=4.14.0",
    "yfinance>=1.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "pytest>=8.0",
    "pytest-subtests>=0.13",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    # FastAPI's TestClient (tests/test_web_*.py) is httpx-backed. httpx is only
    # a transitive dep in practice (langchain-openai -> openai -> httpx), so a
    # [dev]-only resolution must declare it or the web tests cannot even import.
    "httpx>=0.27",
]
# Amazon Bedrock support (AWS SigV4 auth + boto3). Optional so the core install
# stays lean: pip install "yiagents[bedrock]".
bedrock = [
    "langchain-aws>=1.5.0",
]
# Local web UI (FastAPI + vanilla JS). Optional so a headless / server install
# stays lean: pip install "yiagents[web]". The web/ source tree is NOT a
# packaged module (excluded from packages.find below) — it's run in place from
# the project root (it spawns scripts/run_robust.py and reads ~/.yiagents/logs).
# Plain ``uvicorn`` (no [standard] extra) is enough for the default run; the
# [standard] extra only adds auto-reload/websockets deps we don't use.
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
# Native China A-share data vendors for the optional ``a_share_native`` category
# (BaoStock OHLC/TTM valuation + AKShare 东财 news). Optional so the core install
# stays lean: ``pip install "yiagents[a-share]"``. The vendors are lazy-imported,
# so default-off runs (and machines without this extra) are unaffected — the
# category degrades to a sentinel when the libs are absent. curl_cffi is an
# optional anti-bot enhancer for AKShare (not required; degrades gracefully).
a-share = [
    "baostock>=0.8.8",
    "akshare>=1.17.86",
]
# Tushare Pro — opt-in quality tier (needs TUSHARE_TOKEN). Separate extra because
# it requires a token the keyless vendors do not. ``pip install "yiagents[a-share-tushare]"``.
a-share-tushare = [
    "tushare>=1.4.21",
]

[project.scripts]
yiagents = "yiagents.cli.main:app"

[tool.setuptools.packages.find]
include = ["yiagents*"]

[tool.setuptools.package-data]
"yiagents.cli" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["yiagents"]

[tool.coverage.report]
# Coverage gate: baseline is 78% (2026-08-10). The 3-point cushion absorbs
# minor fluctuations from new untested modules without flaking CI; the gate
# still catches real regressions. Raise the floor as coverage improves.
fail_under = 75
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["results", "worklog"]

[tool.ruff.lint]
# Standard "good defaults" rule set (pyflakes + pycodestyle + isort + bugbear +
# pyupgrade + comprehensions/simplify). Line length (E501) and layout are owned
# by the formatter; whole-repo `ruff format` adoption is deferred until the
# open-PR backlog clears, to avoid mass merge conflicts.
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]   # intentional re-exports
"yiagents/cli/main.py" = ["B008"]  # typer.Option(...) defaults are the framework's idiom

[tool.ruff.lint.isort]
# Keep multiple aliased names from one module in a single combined import block
# (e.g. the vendor re-exports in interface.py) instead of one statement per name.
combine-as-imports = true

[tool.mypy]
# Gradual typing: the repo carries inline annotations on ~87% of source files.
# We start permissive (no --strict) and tighten per-module as baselines are
# cleaned. The CI job scopes mypy to the money path (execution), risk overlay,
# backtest engine, graph, agents, dataflows, and CLI — see ci.yml.
python_version = "3.10"
warn_unused_ignores = false
warn_redundant_casts = true
warn_return_any = false
no_implicit_optional = true
check_untyped_defs = false

# Third-party libs (langchain, yfinance, binance SDK, backtrader, …) ship no
# py.typed markers; silence their import errors so real issues stay visible.
ignore_missing_imports = true

# Skip opening any transitive stub (incl. numpy's PEP 695 `type X = ...` aliases,
# which require Python 3.12+ and abort the run with a [syntax] error under
# python_version="3.10"). This mirrors the ``--follow-imports=skip`` CLI flag in
# ci.yml. NOTE: --follow-imports=skip alone only handles *transitive* imports.
# When a checked source file *directly* does ``import numpy`` (as risk/,
# backtest/, dataflows/ do), mypy still parses numpy's stub and aborts. The real
# workaround for direct imports is ``--no-site-packages`` in ci.yml, which makes
# mypy treat ALL third-party modules as Any so the stub is never parsed. The
# project's own source files are still fully type-checked either way.
follow_imports = "skip"

[[tool.mypy.overrides]]
# Forward documentation for the numpy PEP 695 stub issue (numpy>=2.1 ships
# ``type X = ...`` aliases in numpy/__init__.pyi that require Python 3.12+; we
# type-check against 3.10 so parsing the stub raises [syntax] and aborts the run
# before any real issues surface). A per-module follow_imports override does NOT
# prevent the syntax-parse stage from failing (the stub is parsed before follow
# policy is applied), so this override alone is cosmetic. The real fixes are the
# ``--no-site-packages --follow-imports=skip`` CLI flags in ci.yml. We keep this
# override as forward documentation: if mypy later honors per-module
# follow_imports at parse time, or if numpy is bumped/pinned differently, this
# records the intent for numpy specifically.
module = "numpy"
follow_imports = "skip"

[[tool.mypy.overrides]]
# The execution layer is money-touching: check function bodies there even when
# defs are untyped, so a wrong-type arg is caught before order placement.
module = "yiagents.execution.*"
check_untyped_defs = true
