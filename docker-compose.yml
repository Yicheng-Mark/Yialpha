services:
  yialpha:
    build: .
    env_file:
      - .env
    volumes:
      - yialpha_data:/home/appuser/.yialpha
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  yialpha-ollama:
    build: .
    env_file:
      - .env
    environment:
      - YIALPHA_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - yialpha_data:/home/appuser/.yialpha
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  yialpha_data:
  ollama_data:
