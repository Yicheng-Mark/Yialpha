<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YiAgents</title>
  <!-- Apply persisted theme before first paint to avoid a dark→light flash. -->
  <script src="/static/theme-init.js?v=1"></script>
  <link rel="stylesheet" href="/static/styles.css?v=4" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a class="brand" href="#/"><span class="logo"></span>YiAgents</a>
      <nav class="nav">
        <a href="#/" data-i18n="nav_home">历史报告</a>
        <a href="#/new" data-i18n="nav_new">提交新分析</a>
        <a href="#/health" data-i18n="nav_health">环境自检</a>
      </nav>
    </div>
    <div class="topbar-right">
      <button id="theme-toggle" class="btn btn-icon" title="主题"></button>
      <button id="lang-toggle" class="btn btn-ghost" data-i18n="lang_btn">🌐 EN</button>
    </div>
  </header>

  <main id="view" class="container">
    <p class="muted" data-i18n="common_loading">加载中…</p>
  </main>

  <footer class="footer">
    <span class="muted">YiAgents · <span data-i18n="footer_note">报告语言跟随 🌐 切换</span></span>
  </footer>

  <!-- Offline HTML sanitizer (DOMPurify 3.4.13, Apache-2.0/MPL-2.0). -->
  <script src="/static/vendor/purify.min.js"></script>
  <!-- Offline markdown renderer (marked v15, MIT). No CDN at runtime. -->
  <script src="/static/vendor/marked.min.js"></script>
  <!-- ECharts 5.5 (Apache-2.0), vendored locally — offline, no CDN. -->
  <script src="/static/vendor/echarts.min.js"></script>
  <script src="/static/i18n.js?v=4"></script>
  <script src="/static/charts.js?v=4"></script>
  <script src="/static/app.js?v=5"></script>
</body>
</html>
